<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedCards">
<meta name="theme-color" content="#0A0F1E">
<title>MedCards</title>
<link rel="manifest" href="#" id="manifest-placeholder">

<!-- PWA icons embedded as data URIs (teal gradient square) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0F1E'/%3E%3Ctext x='90' y='120' text-anchor='middle' font-size='90'%3E🩺%3C/text%3E%3C/svg%3E">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0A0F1E; color: #F1F5F9; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif; min-height: 100vh; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #root { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; min-height: 100vh; }

  /* Typography */
  h1,h2,h3,p { margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  /* Animations */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 1s linear infinite; }

  /* Card flip */
  .card-scene { perspective: 1200px; cursor: pointer; margin-bottom: 22px; }
  .card-inner { position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.4,0,.2,1); min-height: 280px; }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #0F172A; border: 1px solid #1E293B; border-radius: 18px;
    padding: 24px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; text-align: center; min-height: 280px;
  }
  .card-back { transform: rotateY(180deg); background: #0F1F2E; border-color: #2DD4BF33; }

  /* Dot progress */
  .dot { width: 8px; height: 8px; border-radius: 50%; transition: background 0.3s; }

  /* Tap states */
  .tappable:active { opacity: 0.75; transform: scale(0.98); }

  /* Install banner */
  #install-banner {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0F172A; border-top: 1px solid #1E293B;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    display: none; z-index: 200;
  }

  /* Overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: #0F172A; border: 1px solid #1E293B; border-radius: 18px;
    padding: 26px; width: 100%; max-width: 420px;
  }

  /* Scrollable body */
  .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* API key input */
  #api-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 32px 20px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- API Key Screen (shown on first launch) -->
<div id="api-screen" style="display:none;">
  <div style="font-size:52px;margin-bottom:16px;">🩺</div>
  <h2 style="font-size:24px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#2DD4BF,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">MedCards</h2>
  <p style="color:#64748B;font-size:14px;margin-bottom:32px;line-height:1.6;">AI-powered clinical revision.<br>Enter your Anthropic API key to get started.<br>Your key is stored only on this device.</p>
  <div style="width:100%;max-width:380px;">
    <input id="api-key-input" type="password" placeholder="sk-ant-…" style="width:100%;padding:14px;background:#0F172A;border:1px solid #1E293B;border-radius:12px;color:#F1F5F9;font-size:14px;outline:none;margin-bottom:12px;">
    <button onclick="saveApiKey()" style="width:100%;padding:14px;background:linear-gradient(135deg,#2DD4BF,#818CF8);border:none;border-radius:12px;color:#0A0F1E;font-size:15px;font-weight:700;margin-bottom:16px;">Get Started</button>
    <p style="color:#475569;font-size:12px;line-height:1.6;">
      Get a free API key at <a href="https://console.anthropic.com" target="_blank" style="color:#2DD4BF;">console.anthropic.com</a>.<br>
      Your key never leaves your device.
    </p>
  </div>
</div>

<!-- Main App -->
<div id="root"></div>

<!-- Install Banner (iOS) -->
<div id="install-banner">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:28px;">📲</span>
    <div style="flex:1;">
      <div style="font-weight:700;font-size:14px;color:#F1F5F9;">Install MedCards</div>
      <div style="font-size:12px;color:#64748B;margin-top:2px;">Tap Share → Add to Home Screen</div>
    </div>
    <button onclick="document.getElementById('install-banner').style.display='none'"
      style="background:none;border:none;color:#64748B;font-size:20px;padding:4px;">✕</button>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const DEFAULT_FOLDERS = [
  { id: 1, name: "ESC Guidelines 2024", color: "#2DD4BF", icon: "📋", notes: "", images: [] },
  { id: 2, name: "NEJM Reviews",        color: "#F59E0B", icon: "📄", notes: "", images: [] },
];
const DIFFICULTY_LEVELS = [
  { id: "basic",        label: "Basic",        desc: "Definition-level recall",         color: "#2DD4BF" },
  { id: "intermediate", label: "Intermediate", desc: "Mechanism & application",          color: "#F59E0B" },
  { id: "advanced",     label: "Advanced",     desc: "Clinical reasoning & edge cases", color: "#EF4444" },
];
const FOLDER_COLORS = ["#2DD4BF","#F59E0B","#EF4444","#818CF8","#34D399","#F472B6","#60A5FA","#A78BFA"];
const FOLDER_ICONS  = ["📋","📄","🫀","🧠","💊","🔬","🩺","📊","🧬","🩻"];

// ─── STATE ───────────────────────────────────────────────────────────────────
let S = {
  view: "home",          // home | folder | quickcards | flashcards
  selFolder: null,
  folders: [],
  quickCards: [],
  history: [],
  flashcards: [],
  cardIdx: 0,
  flipped: false,
  cardResults: {},
  showSummary: false,
  difficulty: "intermediate",
  tab: "text",
  editNotes: false,
  notesDraft: "",
  loading: false,
  loadingImg: false,
  dragOver: false,
  error: "",
  showNewFolder: false,
  newName: "", newColor: FOLDER_COLORS[0], newIcon: FOLDER_ICONS[0],
  qcEditId: null,
  qcFront: "", qcBack: "", qcHint: "", qcTag: "",
  apiKey: "",
  showExport: false,
  showImport: false,
  importText: "",
};

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {
    // storage full - try to clear history first
    try { localStorage.removeItem("mc:history"); localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }
}

function loadAll() {
  S.folders    = lsGet("mc:folders",    DEFAULT_FOLDERS).map(f => ({...f, images: f.images||[]}));
  S.quickCards = lsGet("mc:quickcards", []);
  S.history    = lsGet("mc:history",    []);
  S.apiKey     = lsGet("mc:apikey",     "");
}
function saveFolders()    { lsSet("mc:folders",    S.folders); }
function saveQuickCards() { lsSet("mc:quickcards", S.quickCards); }
function saveHistory()    { lsSet("mc:history",    S.history); }

// ─── API KEY ─────────────────────────────────────────────────────────────────
function saveApiKey() {
  const key = document.getElementById("api-key-input").value.trim();
  if (!key.startsWith("sk-")) { alert("Please enter a valid Anthropic API key (starts with sk-ant-…)"); return; }
  S.apiKey = key;
  lsSet("mc:apikey", key);
  document.getElementById("api-screen").style.display = "none";
  render();
}
function changeApiKey() {
  S.apiKey = "";
  lsSet("mc:apikey", "");
  document.getElementById("api-screen").style.display = "flex";
  document.getElementById("root").innerHTML = "";
}

// ─── IMAGE COMPRESS ───────────────────────────────────────────────────────────
function compressImage(dataUrl, maxW=800, quality=0.72) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

// ─── API CALLS ───────────────────────────────────────────────────────────────
async function claudeAPI(system, userMsg, images=[]) {
  const content = [];
  images.forEach(b64 => content.push({ type:"image", source:{type:"base64", media_type:"image/jpeg", data:b64} }));
  content.push({ type:"text", text: userMsg });
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type":"application/json", "x-api-key": S.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system, messages:[{role:"user",content}] }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return (data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
}

async function generateTextCards() {
  const folder = S.folders.find(f => f.id === S.selFolder);
  if (!folder?.notes?.trim()) { setState({error:"Add text content first."}); return; }
  setState({error:"", loading:true, flashcards:[], cardResults:{}});
  const prompts = {
    basic:        "Generate 6 basic flashcards — key definitions and factual recall.",
    intermediate: "Generate 6 intermediate flashcards — mechanisms, pathophysiology, clinical application.",
    advanced:     "Generate 6 advanced flashcards — clinical reasoning, nuance, edge cases.",
  };
  try {
    const txt   = await claudeAPI(
      `You are a medical education expert. Return ONLY a JSON array, no markdown. Each: {"q":"question","a":"answer","hint":"clinical pearl","type":"text"}`,
      `${prompts[S.difficulty]}\n\nContent from "${folder.name}":\n${folder.notes}\n\nReturn exactly 6 flashcards as JSON array.`
    );
    launchSession(JSON.parse(txt), folder.name, folder.icon, folder.color);
  } catch(e) { setState({error:"Failed to generate: " + e.message}); }
  finally    { setState({loading:false}); }
}

async function analyseImage(file) {
  if (!file || !file.type.startsWith("image/")) { setState({error:"Please choose an image file."}); return; }
  setState({loadingImg:true, error:""});
  try {
    const dataUrl    = await new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const compressed = await compressImage(dataUrl);
    const b64        = compressed.split(",")[1];
    const txt = await claudeAPI(
      `You are an expert pathologist. Analyse the image and return ONLY a JSON object, no markdown: {"diagnosis":"short diagnosis","findings":"2-3 key microscopic findings","hint":"one clinical pearl","confidence":"high|medium|low"}`,
      "Analyse this pathology slide and return the JSON.",
      [b64]
    );
    const info  = JSON.parse(txt);
    const entry = { id:Date.now(), dataUrl:compressed, diagnosis:info.diagnosis||"Unknown", findings:info.findings||"", hint:info.hint||"", confidence:info.confidence||"medium", name:file.name };
    S.folders = S.folders.map(f => f.id===S.selFolder ? {...f, images:[...f.images, entry]} : f);
    saveFolders();
  } catch(e) { setState({error:"Could not analyse image: "+e.message}); }
  finally    { setState({loadingImg:false}); }
}

// ─── SESSION ─────────────────────────────────────────────────────────────────
function launchSession(cards, folderName, folderIcon, folderColor, isQuick=false) {
  const entry = {
    id:Date.now(), folderId:isQuick?"quick":S.selFolder,
    folderName, folderIcon, folderColor, difficulty:S.difficulty, cards,
    date: new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),
  };
  S.history    = [entry, ...S.history].slice(0, 50);
  saveHistory();
  setState({ flashcards:cards, cardIdx:0, flipped:false, showSummary:false, cardResults:{}, view:"flashcards" });
}

function markCard(result) {
  S.cardResults[S.cardIdx] = result;
  if (S.cardIdx < S.flashcards.length - 1) {
    setTimeout(() => setState({cardIdx: S.cardIdx+1, flipped:false}), 280);
  } else {
    setTimeout(() => setState({showSummary:true}), 280);
  }
}

// ─── STATE UPDATE & RENDER ────────────────────────────────────────────────────
function setState(partial) {
  Object.assign(S, partial);
  render();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  if (!root) return;

  // Show API key screen if no key
  if (!S.apiKey) {
    document.getElementById("api-screen").style.display = "flex";
    root.innerHTML = "";
    return;
  }
  document.getElementById("api-screen").style.display = "none";

  if (S.view === "flashcards" && S.showSummary) { root.innerHTML = renderSummary(); bindSummary(); return; }
  if (S.view === "flashcards")                   { root.innerHTML = renderSession();  bindSession();  return; }
  if (S.view === "quickcards")                   { root.innerHTML = renderQuickCards(); bindQuickCards(); return; }
  if (S.view === "folder")                        { root.innerHTML = renderFolder();   bindFolder();   return; }
  root.innerHTML = renderHome(); bindHome();
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function renderHome() {
  const diff = DIFFICULTY_LEVELS.find(d => d.id === S.difficulty);
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">
    <div>
      <h1 style="font-size:26px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#2DD4BF,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">MedCards</h1>
      <p style="color:#475569;font-size:13px;margin-top:4px;">AI-powered clinical revision</p>
    </div>
    <button id="btn-new-folder" style="background:linear-gradient(135deg,#2DD4BF22,#818CF822);border:1px solid #2DD4BF44;color:#2DD4BF;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;">+ New Folder</button>
  </div>

  <!-- Quick Cards -->
  <div id="btn-quickcards" class="tappable" style="background:linear-gradient(135deg,#818CF811,#2DD4BF08);border:1px solid #818CF833;border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:24px;">
    <div style="font-size:28px;">⚡</div>
    <div style="flex:1;">
      <div style="color:#F1F5F9;font-weight:700;font-size:15px;">Quick Cards</div>
      <div style="color:#64748B;font-size:12px;margin-top:2px;">${S.quickCards.length > 0 ? S.quickCards.length+" card"+(S.quickCards.length!==1?"s":"")+" · tap to review or add more" : "Write individual cards — no folder needed"}</div>
    </div>
    <div style="color:#818CF8;font-size:18px;font-weight:700;">→</div>
  </div>

  <div style="color:#64748B;font-size:11px;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase;">Your Folders</div>
  <div style="display:flex;flex-direction:column;gap:10px;">
    ${S.folders.map(f => `
    <div class="folder-card tappable" data-id="${f.id}" style="background:#0F172A;border:1px solid ${f.color}44;border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;">
      <div style="width:38px;height:38px;border-radius:10px;background:${f.color}18;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${f.icon}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:15px;color:#F1F5F9;">${esc(f.name)}</div>
        <div style="color:#475569;font-size:12px;margin-top:3px;display:flex;gap:10px;">
          <span>${f.notes?.trim()?"📝 Notes":"No text"}</span>
          ${f.images?.length>0?`<span>🔬 ${f.images.length} slides</span>`:""}
        </div>
      </div>
      <div style="color:${f.color};font-size:18px;font-weight:700;">→</div>
    </div>`).join("")}
  </div>

  ${S.history.length>0?`
  <div style="margin-top:32px;">
    <div style="color:#64748B;font-size:11px;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase;">Previous Sessions</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${S.history.map((entry,i) => {
        const d = DIFFICULTY_LEVELS.find(x=>x.id===entry.difficulty);
        return `<div class="history-card tappable" data-idx="${i}" style="display:flex;align-items:center;gap:10px;background:#0F172A;border:1px solid #1E293B;border-radius:12px;padding:12px 14px;cursor:pointer;">
          <span style="font-size:20px;">${entry.folderIcon}</span>
          <div style="flex:1;">
            <div style="color:#CBD5E1;font-size:13px;font-weight:600;">${esc(entry.folderName)}</div>
            <div style="color:#475569;font-size:12px;">${entry.date} · ${entry.cards.length} cards</div>
          </div>
          <span style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:${d?.color}22;color:${d?.color};">${d?.label}</span>
        </div>`;
      }).join("")}
    </div>
    <button id="btn-clear-history" style="background:#1E293B;border:1px solid #334155;border-radius:12px;color:#94A3B8;font-size:13px;font-weight:600;padding:12px 20px;width:100%;margin-top:10px;">Clear History</button>
  </div>`:""}

  <div style="margin-top:24px;text-align:center;">
    <button id="btn-change-key" style="background:none;border:none;color:#334155;font-size:12px;text-decoration:underline;">Change API key</button>
  </div>

  ${renderNewFolderModal()}
  `;
}

function bindHome() {
  document.getElementById("btn-new-folder")?.addEventListener("click", () => setState({showNewFolder:true}));
  document.getElementById("btn-quickcards")?.addEventListener("click", () => setState({view:"quickcards", qcEditId:null, error:""}));
  document.getElementById("btn-clear-history")?.addEventListener("click", () => { S.history=[]; saveHistory(); render(); });
  document.getElementById("btn-change-key")?.addEventListener("click", changeApiKey);
  document.querySelectorAll(".folder-card").forEach(el => el.addEventListener("click", () => openFolder(+el.dataset.id)));
  document.querySelectorAll(".history-card").forEach(el => el.addEventListener("click", () => {
    const entry = S.history[+el.dataset.idx];
    S.selFolder = entry.folderId==="quick"?null:entry.folderId;
    S.difficulty = entry.difficulty;
    launchSession(entry.cards, entry.folderName, entry.folderIcon, entry.folderColor, entry.folderId==="quick");
  }));
  bindNewFolderModal();
}

// ─── NEW FOLDER MODAL ────────────────────────────────────────────────────────
function renderNewFolderModal() {
  if (!S.showNewFolder) return "";
  return `<div class="overlay" id="overlay-folder">
    <div class="modal">
      <h3 style="margin:0 0 18px;color:#F1F5F9;">New Folder</h3>
      <input id="new-folder-name" type="text" placeholder="e.g. Renal Pathology" value="${esc(S.newName)}"
        style="width:100%;padding:12px 14px;background:#0A0F1E;border:1px solid #1E293B;border-radius:10px;color:#F1F5F9;font-size:14px;outline:none;margin-bottom:16px;">
      <div style="color:#64748B;font-size:11px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;">Colour</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
        ${FOLDER_COLORS.map(c=>`<div class="color-pick tappable" data-color="${c}" style="width:26px;height:26px;border-radius:8px;background:${c};cursor:pointer;border:${S.newColor===c?"3px solid #fff":"3px solid transparent"};"></div>`).join("")}
      </div>
      <div style="color:#64748B;font-size:11px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;">Icon</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;">
        ${FOLDER_ICONS.map(ic=>`<div class="icon-pick tappable" data-icon="${ic}" style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:${S.newIcon===ic?"#1E293B":"transparent"};border:${S.newIcon===ic?`2px solid ${S.newColor}`:"2px solid transparent"};">${ic}</div>`).join("")}
      </div>
      <div style="display:flex;gap:10px;">
        <button id="btn-cancel-folder" style="flex:1;padding:12px;background:#1E293B;border:1px solid #334155;border-radius:12px;color:#94A3B8;font-size:14px;font-weight:600;">Cancel</button>
        <button id="btn-create-folder" style="flex:1;padding:12px;background:linear-gradient(135deg,#2DD4BF,#818CF8);border:none;border-radius:12px;color:#0A0F1E;font-size:14px;font-weight:700;">Create</button>
      </div>
    </div>
  </div>`;
}
function bindNewFolderModal() {
  document.getElementById("btn-cancel-folder")?.addEventListener("click", () => setState({showNewFolder:false}));
  document.getElementById("btn-create-folder")?.addEventListener("click", () => {
    const name = document.getElementById("new-folder-name")?.value.trim();
    if (!name) return;
    S.folders.push({id:Date.now(), name, color:S.newColor, icon:S.newIcon, notes:"", images:[]});
    saveFolders();
    setState({showNewFolder:false, newName:"", newColor:FOLDER_COLORS[0], newIcon:FOLDER_ICONS[0]});
  });
  document.getElementById("new-folder-name")?.addEventListener("input", e => S.newName = e.target.value);
  document.querySelectorAll(".color-pick").forEach(el => el.addEventListener("click", () => setState({newColor:el.dataset.color})));
  document.querySelectorAll(".icon-pick").forEach(el => el.addEventListener("click", () => setState({newIcon:el.dataset.icon})));
}

// ─── FOLDER VIEW ─────────────────────────────────────────────────────────────
function openFolder(id) {
  const f = S.folders.find(x=>x.id===id);
  setState({selFolder:id, view:"folder", tab:"text", editNotes:false, notesDraft:f?.notes||"", error:""});
}

function renderFolder() {
  const folder = S.folders.find(f=>f.id===S.selFolder);
  if (!folder) return "";
  const diff = DIFFICULTY_LEVELS.find(d=>d.id===S.difficulty);
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">

function bindFolder() {
  const folder = S.folders.find(f=>f.id===S.selFolder);
  document.getElementById("btn-back-home")?.addEventListener("click", () => setState({view:"home"}));
  document.getElementById("btn-delete-folder")?.addEventListener("click", () => {
    if (confirm(`Delete "${folder?.name}"?`)) { S.folders=S.folders.filter(f=>f.id!==S.selFolder); saveFolders(); setState({view:"home"}); }
  });
  document.querySelectorAll(".tab-btn").forEach(el => el.addEventListener("click", () => setState({tab:el.dataset.tab, error:""})));
  // Text tab
  document.getElementById("btn-edit-notes")?.addEventListener("click", () => setState({editNotes:true}));
  document.getElementById("btn-edit-notes2")?.addEventListener("click", () => setState({editNotes:true}));
  document.getElementById("btn-save-notes")?.addEventListener("click", () => {
    const val = document.getElementById("notes-textarea")?.value||"";
    S.folders = S.folders.map(f=>f.id===S.selFolder?{...f,notes:val}:f);
    saveFolders();
    setState({editNotes:false, notesDraft:val});
  });
  document.getElementById("notes-textarea")?.addEventListener("input", e => S.notesDraft=e.target.value);
  document.querySelectorAll(".diff-btn").forEach(el => el.addEventListener("click", () => setState({difficulty:el.dataset.diff})));
  document.getElementById("btn-gen-text")?.addEventListener("click", () => { if(!S.loading) generateTextCards(); });
  // Images tab
  const dz = document.getElementById("drop-zone");
  const fi = document.getElementById("img-file-input");
  dz?.addEventListener("click", () => fi?.click());
  fi?.addEventListener("change", e => { if(e.target.files[0]) analyseImage(e.target.files[0]); });
  dz?.addEventListener("dragover", e => { e.preventDefault(); setState({dragOver:true}); });
  dz?.addEventListener("dragleave", () => setState({dragOver:false}));
  dz?.addEventListener("drop", e => { e.preventDefault(); setState({dragOver:false}); if(e.dataTransfer.files[0]) analyseImage(e.dataTransfer.files[0]); });
  document.querySelectorAll(".delete-img-btn").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    S.folders = S.folders.map(f=>f.id===S.selFolder?{...f,images:f.images.filter(i=>i.id!==+el.dataset.imgid)}:f);
    saveFolders(); render();
  }));
  document.getElementById("btn-gen-images")?.addEventListener("click", () => {
    if (!folder?.images?.length) { setState({error:"Add images first."}); return; }
    launchSession(folder.images.map(img=>({type:"image",q:"What is the diagnosis?",a:img.diagnosis,findings:img.findings,hint:img.hint,dataUrl:img.dataUrl,confidence:img.confidence})), folder.name, folder.icon, folder.color);
  });
}

function bindQuickCards() {
  document.getElementById("btn-qc-back")?.addEventListener("click", () => setState({view:"home", error:""}));
  document.getElementById("btn-export")?.addEventListener("click", () => setState({showExport:true}));
  document.getElementById("btn-import")?.addEventListener("click", () => setState({showImport:true, importText:"", error:""}));
  document.getElementById("btn-export-close")?.addEventListener("click", () => setState({showExport:false}));
  document.getElementById("btn-export-copy")?.addEventListener("click", () => {
    const txt = document.getElementById("export-text");
    txt?.select();
    navigator.clipboard?.writeText(JSON.stringify(S.quickCards, null, 2))
      .then(() => alert("Copied! Now open the other app and tap Import."))
      .catch(() => { txt?.select(); alert("Select all the text and copy manually (press Copy)."); });
  });
  document.getElementById("btn-import-cancel")?.addEventListener("click", () => setState({showImport:false, error:""}));
  document.getElementById("import-textarea")?.addEventListener("input", e => S.importText = e.target.value);
  document.getElementById("btn-import-go")?.addEventListener("click", () => {
    try {
      const imported = JSON.parse(S.importText);
      if (!Array.isArray(imported)) throw new Error("bad format");
      const existingIds = new Set(S.quickCards.map(q => q.id));
      const newCards = imported.filter(c => c.front && c.back)
        .map(c => ({...c, id: existingIds.has(c.id) ? Date.now()+Math.random() : c.id}));
      S.quickCards = [...S.quickCards, ...newCards];
      saveQuickCards();
      setState({showImport:false, importText:"", error:""});
      alert("✅ Imported " + newCards.length + " cards successfully!");
    } catch { setState({error:"Could not read that data — make sure you copied the full export text."}); }
  });
  document.getElementById("btn-qc-new")?.addEventListener("click", () => setState({qcEditId:"new", qcFront:"", qcBack:"", qcHint:"", qcTag:"", error:""}));
  document.getElementById("btn-qc-cancel")?.addEventListener("click", () => setState({qcEditId:null, error:""}));
  document.getElementById("btn-study-quick")?.addEventListener("click", () => {
    if(!S.quickCards.length){setState({error:"Add cards first."});return;}
    launchSession(S.quickCards.map(q=>({type:"text",q:q.front,a:q.back,hint:q.hint})),"Quick Cards","⚡","#818CF8",true);
  });
  document.getElementById("btn-qc-save")?.addEventListener("click", () => {
    const front = document.getElementById("qc-front")?.value.trim()||"";
    const back  = document.getElementById("qc-back")?.value.trim()||"";
    const hint  = document.getElementById("qc-hint")?.value.trim()||"";
    const tag   = document.getElementById("qc-tag")?.value.trim()||"";
    if(!front||!back){setState({error:"Front and back are required."});return;}
    if(S.qcEditId==="new") {
      S.quickCards.push({id:Date.now(), front, back, hint, tag});
    } else {
      S.quickCards = S.quickCards.map(q=>q.id===S.qcEditId?{...q,front,back,hint,tag}:q);
    }
    saveQuickCards();
    setState({qcEditId:null, error:""});
  });
  document.querySelectorAll(".qc-edit-btn").forEach(el => el.addEventListener("click", () => {
    const q = S.quickCards.find(x=>x.id===+el.dataset.qcid);
    if(q) setState({qcEditId:q.id, qcFront:q.front, qcBack:q.back, qcHint:q.hint||"", qcTag:q.tag||"", error:""});
  }));
  document.querySelectorAll(".qc-del-btn").forEach(el => el.addEventListener("click", () => {
    S.quickCards = S.quickCards.filter(q=>q.id!==+el.dataset.qcid);
    saveQuickCards(); render();
  }));
}

// ─── FLASHCARD SESSION ────────────────────────────────────────────────────────
function renderSession() {
  const card    = S.flashcards[S.cardIdx];
  const diff    = DIFFICULTY_LEVELS.find(d=>d.id===S.difficulty);
  const isImage = card?.type==="image";
  const progress= (S.cardIdx / S.flashcards.length)*100;
  const folder  = S.folders.find(f=>f.id===S.selFolder);
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <button id="btn-session-back" style="background:none;border:none;color:#64748B;font-size:14px;padding:0;">← Back</button>
    <div style="text-align:center;">
      <span style="padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:${diff?.color}22;color:${diff?.color};">${diff?.label}</span>
      <div style="color:#64748B;font-size:12px;margin-top:3px;">${S.selFolder?folder?.icon+" "+esc(folder?.name||""):"⚡ Quick Cards"}</div>
    </div>
    <span style="color:#64748B;font-size:13px;">${S.cardIdx+1} / ${S.flashcards.length}</span>
  </div>

  <div style="height:4px;background:#1E293B;border-radius:2px;margin-bottom:26px;overflow:hidden;">
    <div style="height:100%;width:${progress}%;background:${diff?.color};border-radius:2px;transition:width .4s ease;"></div>
  </div>

  <div class="card-scene" id="card-scene">
    <div class="card-inner${S.flipped?" flipped":""}" id="card-inner">
      <div class="card-face">
        ${isImage
          ? `<img src="${card.dataUrl}" alt="pathology slide" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-bottom:16px;"><p style="color:#94A3B8;font-size:14px;margin:0;">What is the diagnosis?</p>`
          : `<div style="color:#64748B;font-size:12px;margin-bottom:20px;letter-spacing:2px;text-transform:uppercase;">Question</div>
             <p style="font-size:18px;font-weight:500;line-height:1.55;color:#F1F5F9;margin:0;">${esc(card?.q||"")}</p>`}
        <div style="margin-top:24px;color:#334155;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;">Tap to reveal answer</div>
      </div>
      <div class="card-face card-back">
        <div style="color:#2DD4BF;font-size:12px;margin-bottom:12px;letter-spacing:2px;text-transform:uppercase;">${isImage?"Diagnosis":"Answer"}</div>
        <p style="font-size:${isImage?22:17}px;font-weight:700;line-height:1.4;color:#F1F5F9;margin:0;">${esc(card?.a||"")}</p>
        ${isImage&&card?.findings?`<p style="color:#CBD5E1;font-size:13px;margin-top:10px;line-height:1.6;">${esc(card.findings)}</p>`:""}
        ${card?.hint?`<div style="margin-top:16px;padding:10px 14px;background:#F59E0B11;border-radius:10px;font-size:13px;color:#94A3B8;border:1px solid #F59E0B22;line-height:1.5;"><span style="color:#F59E0B;">💡</span> ${esc(card.hint)}</div>`:""}
        ${isImage&&card?.confidence?`<div style="margin-top:10px;font-size:11px;color:#475569;">AI confidence: <span style="color:${card.confidence==="high"?"#2DD4BF":card.confidence==="medium"?"#F59E0B":"#EF4444"};">${card.confidence}</span></div>`:""}
      </div>
    </div>
  </div>

  ${S.flipped?`
  <div style="display:flex;gap:8px;margin-bottom:20px;">
    <button id="btn-missed" style="flex:1;padding:12px 8px;border-radius:12px;font-size:14px;font-weight:600;background:#EF444422;color:#EF4444;border:1px solid #EF444444;">✗ Missed</button>
    <button id="btn-unsure" style="flex:1;padding:12px 8px;border-radius:12px;font-size:14px;font-weight:600;background:#F59E0B22;color:#F59E0B;border:1px solid #F59E0B44;">~ Unsure</button>
    <button id="btn-got"    style="flex:1;padding:12px 8px;border-radius:12px;font-size:14px;font-weight:600;background:#2DD4BF22;color:#2DD4BF;border:1px solid #2DD4BF44;">✓ Got it</button>
  </div>`:""}

  <div style="display:flex;gap:6px;justify-content:center;margin-top:${S.flipped?0:20}px;">
    ${S.flashcards.map((_,i)=>{
      const r=S.cardResults[i];
      const col=r==="got"?"#2DD4BF":r==="missed"?"#EF4444":r==="unsure"?"#F59E0B":"#1E293B";
      return `<div class="dot" style="background:${i===S.cardIdx?"#fff":col};"></div>`;
    }).join("")}
  </div>`;
}

function bindSession() {
  document.getElementById("btn-session-back")?.addEventListener("click", () => {
    setState({view: S.selFolder?"folder":"quickcards"});
  });
  document.getElementById("card-scene")?.addEventListener("click", () => setState({flipped:!S.flipped}));
  document.getElementById("btn-missed")?.addEventListener("click", e => { e.stopPropagation(); markCard("missed"); });
  document.getElementById("btn-unsure")?.addEventListener("click", e => { e.stopPropagation(); markCard("unsure"); });
  document.getElementById("btn-got")?.addEventListener("click",    e => { e.stopPropagation(); markCard("got");    });
}

// ─── SUMMARY ─────────────────────────────────────────────────────────────────
function renderSummary() {
  const correct = Object.values(S.cardResults).filter(v=>v==="got").length;
  const total   = S.flashcards.length;
  return `
  <div style="background:#0F172A;border:1px solid #1E293B;border-radius:20px;padding:36px;text-align:center;margin-top:48px;">
    <div style="font-size:52px;margin-bottom:12px;">${correct===total?"🏆":correct>=total/2?"✅":"📖"}</div>
    <h2 style="font-size:22px;font-weight:700;color:#F1F5F9;margin-bottom:8px;">Session Complete</h2>
    <div style="margin:16px 0;">
      <span style="color:#2DD4BF;font-size:48px;font-weight:700;">${correct}</span>
      <span style="color:#64748B;font-size:22px;"> / ${total}</span>
    </div>
    <p style="color:#94A3B8;margin-bottom:28px;">${correct===total?"Perfect score — outstanding!":correct>=total/2?"Good work. Keep reviewing.":"More revision needed."}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button id="btn-retry" style="padding:12px 24px;background:linear-gradient(135deg,#2DD4BF,#818CF8);border:none;border-radius:12px;color:#0A0F1E;font-size:15px;font-weight:700;">Retry</button>
      <button id="btn-back-from-summary" style="padding:12px 24px;background:#1E293B;border:1px solid #334155;border-radius:12px;color:#94A3B8;font-size:14px;font-weight:600;">Back</button>
    </div>
  </div>`;
}
function bindSummary() {
  document.getElementById("btn-retry")?.addEventListener("click", () => setState({cardIdx:0,flipped:false,cardResults:{},showSummary:false}));
  document.getElementById("btn-back-from-summary")?.addEventListener("click", () => setState({view:S.selFolder?"folder":"quickcards", showSummary:false}));
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ─── SERVICE WORKER (offline support) ────────────────────────────────────────
if ("serviceWorker" in navigator) {
  const swCode = `
    const CACHE = "medcards-v1";
    self.addEventListener("install", e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(["/medcards.html"]))));
    self.addEventListener("fetch", e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
  `;
  const blob = new Blob([swCode], {type:"text/javascript"});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ─── iOS INSTALL BANNER ───────────────────────────────────────────────────────
function checkInstallBanner() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;
  const dismissed = lsGet("mc:install-dismissed", false);
  if (isIOS && !isStandalone && !dismissed) {
    document.getElementById("install-banner").style.display = "block";
    document.querySelector("#install-banner button")?.addEventListener("click", () => {
      lsSet("mc:install-dismissed", true);
    });
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
loadAll();
if (!S.apiKey) {
  document.getElementById("api-screen").style.display = "flex";
} else {
  render();
}
checkInstallBanner();
</script>
</body>
</html>
